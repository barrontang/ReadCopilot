name: ReadCopilot
options:
  bundleIdPrefix: com.readcopilot
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_NAME: ReadCopilot
    DEVELOPMENT_TEAM: 3R847WPTLS
    CODE_SIGN_STYLE: Automatic
targets:
  ReadCopilot:
    type: application
    supportedDestinations: [macOS, iOS]
    scheme:
      testTargets:
        - ReadCopilotTests
    sources:
      - path: ReadCopilot
    info:
      path: ReadCopilot/Info.plist
      properties:
        CFBundleDisplayName: ReadCopilot
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSExceptionDomains:
            wx.qlogo.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  ReadCopilotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReadCopilot.app/Contents/MacOS/ReadCopilot"
        PRODUCT_MODULE_NAME: ReadCopilotTests
    sources:
      - path: ReadCopilotTests
    dependencies:
      - target: ReadCopilot
